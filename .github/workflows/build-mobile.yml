name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare clean web bundle
        run: npm run build:web

      - name: Add Android platform & generate app icons/splash
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#FEDFB3' --splashBackgroundColor '#FEDFB3'
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to artifact path
        run: cp android/app/build/outputs/apk/debug/app-debug.apk yumspin-android-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: yumspin-android-apk
          path: yumspin-android-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS App (Xcode)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Prepare clean web bundle
        run: npm run build:web

      - name: Add iOS platform & generate app icons/splash
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#FEDFB3' --splashBackgroundColor '#FEDFB3'
          npx cap sync ios

      - name: Build iOS Simulator App
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS Simulator App
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -r "${{ github.workspace }}/yumspin-ios-simulator.app.zip" App.app

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: yumspin-ios-simulator-app
          path: yumspin-ios-simulator.app.zip
          if-no-files-found: error
