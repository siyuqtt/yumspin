name: Release Android App Bundle (.aab) for Google Play

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown on Google Play (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Integer version code (must increase on every Play Store upload, e.g. 1, 2, 3...)'
        required: true
        default: '1'

jobs:
  build-signed-aab:
    name: Build Signed Android App Bundle (.aab)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing Android signing secrets! Please add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub repo Settings -> Secrets and variables -> Actions. See store/google-play/PUBLISH_GUIDE.md."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare clean web bundle
        run: npm run build:web

      - name: Add Android platform & generate adaptive icons/splash
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#FEDFB3' --splashBackgroundColor '#FEDFB3'
          npx cap sync android

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.p12

      - name: Configure Gradle version & release signing
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, re

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              text = f.read()

          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]

          text = re.sub(r"versionCode\s+\d+", f"versionCode {version_code}", text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', text, count=1)

          # 1. Inject signingConfig into buildTypes.release BEFORE adding signingConfigs.release
          text, c2 = re.subn(
              r"(buildTypes\s*\{[\s\S]*?\brelease\s*\{)",
              r"\1\n            signingConfig signingConfigs.release",
              text,
              count=1,
          )
          assert c2 == 1, "Failed to locate buildTypes.release in android/app/build.gradle"

          # 2. Add signingConfigs right before buildTypes
          signing_block = """signingConfigs {
                  release {
                      storeFile file("upload-keystore.p12")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {"""

          text, c1 = re.subn(r"\bbuildTypes\s*\{", signing_block, text, count=1)
          assert c1 == 1, "Failed to locate buildTypes block in android/app/build.gradle"

          with open(gradle_path, "w") as f:
              f.write(text)
          print(f"Configured release signing for v{version_name} (versionCode {version_code})")
          PY

      - name: Build signed Android App Bundle (.aab)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Rename release bundle
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab "yumspin-v${VERSION_NAME}-release.aab"

      - name: Upload Signed Google Play .aab Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yumspin-google-play-aab
          path: yumspin-v*.aab
          if-no-files-found: error
